<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collexa - College Portal</title>
    <link rel="stylesheet" href="css/landing.css">
    <!-- Google Fonts for premium typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login-shared.css"> <!-- Reuse shared background styles -->
</head>

<body>

    <!-- Global Wrapper for Background Consistency -->
    <div class="global-app-wrapper">
        <div class="content-wrapper">
            <header class="main-header">
                <div class="logo-area">
                    <!-- Simple SVG Icon placeholder if needed, or just text -->
                    <svg width="60" height="60" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                        class="uni-icon">
                        <path d="M12 3L1 9L12 15L21 10.09V17H23V9M5 13.18V17.18L12 21L19 17.18V13.18L12 17L5 13.18Z"
                            fill="white" />
                    </svg>
                </div>
                <h1 class="app-title">Collexa</h1>
                <p class="university-name">COLLEGE PORTAL</p>
            </header>

            <main class="cards-container">
                <!-- Administrator Card -->
                <a href="admin-login.html" class="glass-card">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                        </svg>
                    </div>
                    <h2 class="card-title">Administrator</h2>
                    <span class="card-action">Access Portal</span>
                </a>

                <!-- Club Coordinator Card -->
                <a href="coordinator-login.html" class="glass-card">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                    </div>
                    <h2 class="card-title">Club Coordinator</h2>
                    <span class="card-action">Access Portal</span>
                </a>

                <!-- Student Card -->
                <a href="student-login.html" class="glass-card">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                            <path d="M6 12v5c3 3 9 3 12 0v-5" />
                        </svg>
                    </div>
                    <h2 class="card-title">Student</h2>
                    <span class="card-action">Access Portal</span>
                </a>
            </main>

            <footer class="main-footer">
                <p>&copy; 2026 Collexa – College Portal</p>
            </footer>
        </div> <!-- End content-wrapper -->
    </div> <!-- End global-app-wrapper -->

    <script src="js/landing.js"></script>
</body>

</html>
